name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install numpy scipy scikit-learn pytest pillow matplotlib
          pip install -e . --no-deps

      - name: Run the test suite
        env:
          PYTHONPATH: src
        run: python -m pytest -q

      - name: CLI smoke test
        env:
          PYTHONPATH: src
        run: |
          python -m jev_tune.cli status --json || test $? -eq 2
          python -m jev_tune.cli demo --plants 4 --json

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check that the documented commands exist
        run: |
          set -e
          for f in scripts/*.py; do python -c "import ast,sys;ast.parse(open('$f',encoding='utf-8').read(),'$f')"; done
          test -f README.md
          test -f README.zh-CN.md
          test -f NOTICE.md
          test -f CONTRIBUTING.md
