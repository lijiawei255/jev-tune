name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  git-payload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reject accidental release-only data and large historical blobs
        run: python scripts/63_check_git_payload.py

  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # Frozen research evidence is verified at its tag by the archive job;
      # the runtime suite needs no Release download.
      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install numpy scipy scikit-learn pytest pytest-cov matplotlib onnx onnxruntime
          pip install -e . --no-deps

      - name: Run the test suite
        env:
          PYTHONPATH: src
        run: python -m pytest -q --cov --cov-report=term --cov-fail-under=66

      - name: CLI smoke test
        env:
          PYTHONPATH: src
        run: |
          python -m jev_tune.cli status --json || test $? -eq 2
          python -m jev_tune.cli demo --plants 4 --json

  archive:
    name: Frozen v0.10.2 research archive
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify archived evidence in its own worktree
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install numpy scipy scikit-learn pytest matplotlib pillow onnx onnxruntime
          python scripts/archive.py --verify

  c-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install what the exporter needs
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install numpy scipy pytest
          pip install -e . --no-deps
      - name: Verify committed vectors and reject NaN mutations before regeneration
        env:
          PYTHONPATH: src
        run: python -m pytest tests/test_portability.py -k "not matlab" -q

      # gcc is preinstalled on ubuntu-latest; this compiles the C99 reference
      # and checks forward, feature assembly and resampling against Python
      - name: C99 reference matches Python
        env:
          PYTHONPATH: src
        run: python scripts/18_export_c.py --verify

      # the weights are the part that must match the checkpoint byte for byte;
      # the vectors are checked numerically by the harness (a stale vector file
      # makes test_forward fail). Byte-comparing the vectors across platforms is
      # not meaningful: libm/numpy ULP differences reach the JSON.
      - name: Generated weights are up to date
        run: git diff --exit-code -- c/jev_head_weights.h

      # the Makefile is a deliverable too: make sure it still builds and checks
      - name: Makefile builds and passes
        run: make -C c check

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scripts parse and required documents exist
        run: |
          set -e
          for f in scripts/*.py; do python -c "import ast,sys;ast.parse(open('$f',encoding='utf-8').read(),'$f')"; done
          for f in README.md README.zh-CN.md NOTICE.md CONTRIBUTING.md CITATION.cff docs/BOUNDARIES.md docs/TRADEOFFS.md docs/ARCHIVE.md; do test -f "$f"; done
