name: Runtime comparison observer v0100

on:
  workflow_dispatch:

jobs:
  observation:
    name: Windows default runtime comparison observation only
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    env:
      PYTHONPATH: src
      PYTHONUTF8: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install the recorded scientific dependency versions
        run: |
          python -m pip install --upgrade pip
          python - <<'PY'
          import json
          import subprocess
          import sys
          from pathlib import Path
          result = json.loads(Path('research/results/trajectory_risk.json').read_text(encoding='utf-8'))
          packages = result['manifest']['packages']
          subprocess.check_call([sys.executable, '-m', 'pip', 'install',
                                 'torch==' + packages['torch'],
                                 '--index-url', 'https://download.pytorch.org/whl/cpu'])
          subprocess.check_call([sys.executable, '-m', 'pip', 'install',
                                 *[name + '==' + version for name, version in packages.items()
                                   if name != 'torch']])
          PY
          pip install -e . --no-deps
      - name: Capture all fixed cases on the actual default hosted observer
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          import subprocess
          import sys
          output = Path('.local-audit/runtime_observer_launcher')
          output.mkdir(parents=True, exist_ok=True)
          command = [sys.executable, 'scripts/57_observe_runtime_comparison.py',
                     '--label', 'default_hosted_observer',
                     '--out', '.local-audit/default_hosted_observer_v0100']
          stdout, stderr = output/'producer.stdout.txt', output/'producer.stderr.txt'
          with stdout.open('w', encoding='utf-8') as out, stderr.open('w', encoding='utf-8') as err:
              result = subprocess.run(command, stdout=out, stderr=err)
          revision = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          (output/'launcher_result.json').write_text(json.dumps({'command': command, 'returncode': result.returncode,
              'producer_completed': result.returncode == 0, 'git_revision': revision,
              'additional_objective_evaluations': 0, 'gradient_steps': 0,
              'scope': 'Observation collection only; producer completion does not reclassify the preserved strict 54 result'}, indent=2)+'\n', encoding='utf-8')
          print(stdout.read_text(encoding='utf-8'))
          print(stderr.read_text(encoding='utf-8'), file=sys.stderr)
          raise SystemExit(result.returncode)
          PY
      - name: Preserve all fixed-case arrays and actual failure observations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-comparison-observer-v0100-${{ github.run_id }}
          path: |
            .local-audit/default_hosted_observer_v0100/
            .local-audit/runtime_observer_launcher/
          include-hidden-files: true
          if-no-files-found: warn
