name: Calibration runtime diagnosis

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      PYTHONPATH: src
      PYTHONUTF8: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install the recorded scientific versions and CPU Torch
        run: |
          python -m pip install --upgrade pip
          python - <<'PY'
          import json
          import subprocess
          import sys
          from pathlib import Path
          packages = json.loads(Path('research/results/trajectory_risk.json').read_text(encoding='utf-8'))['manifest']['packages']
          subprocess.check_call([sys.executable, '-m', 'pip', 'install', 'torch==' + packages['torch'],
                                 '--index-url', 'https://download.pytorch.org/whl/cpu'])
          subprocess.check_call([sys.executable, '-m', 'pip', 'install',
                                 *[name + '==' + version for name, version in packages.items() if name != 'torch']])
          PY
          pip install -e . --no-deps
      - name: Diagnose default hosted CPU dispatch and preserve original checker status
        run: python scripts/51_diagnose_calibration_runtime.py --out .local-audit/calibration_runtime_default --label default_hosted_cpu
      - name: Diagnose the predeclared original-machine ISA constraint in another process
        if: always()
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import subprocess
          import sys
          # Original i9-13950HX: Torch AVX2; NumPy X86_V2 baseline/X86_V3 dispatch;
          # OpenBLAS Haswell. This is an original-host constraint, not a pass-selected mode.
          root = Path('.local-audit/calibration_runtime_default')
          environment = json.loads((root / 'environment.json').read_text(encoding='utf-8'))
          dispatch = environment['numpy_cpu']['dispatch']
          disabled = [name for name in dispatch if name == 'X86_V4' or name.startswith('AVX512')]
          constraint = {'original_machine': 'i9-13950HX; AVX2; NumPy X86_V2/X86_V3; OpenBLAS Haswell',
                        'observed_hosted_dispatch': dispatch, 'disabled_numpy_dispatch': disabled,
                        'numpy_mask_is_noop': not disabled, 'MKL_ENABLE_INSTRUCTIONS': 'AVX2',
                        'ATEN_CPU_CAPABILITY': 'avx2', 'additional_objective_evaluations': 0}
          root.parent.joinpath('original_machine_constraint.json').write_text(json.dumps(constraint, indent=2)+'\n', encoding='utf-8')
          env = os.environ.copy()
          env['MKL_ENABLE_INSTRUCTIONS'] = 'AVX2'
          env['ATEN_CPU_CAPABILITY'] = 'avx2'
          if disabled:
              env['NPY_DISABLE_CPU_FEATURES'] = ','.join(disabled)
          else:
              env.pop('NPY_DISABLE_CPU_FEATURES', None)
          result = subprocess.run([sys.executable, 'scripts/51_diagnose_calibration_runtime.py',
                                   '--out', '.local-audit/calibration_runtime_original_isa',
                                   '--label', 'predeclared_original_machine_isa'], env=env)
          raise SystemExit(result.returncode)
          PY
      - name: Upload both successful and failed diagnostic records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: calibration-runtime-diagnosis-${{ github.run_id }}
          path: |
            .local-audit/calibration_runtime_default/
            .local-audit/calibration_runtime_original_isa/
            .local-audit/original_machine_constraint.json
          include-hidden-files: true
          if-no-files-found: error
