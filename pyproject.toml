[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jev-tune"
version = "0.1.0"
description = "System-1 (Jev-style) decision heads for control-parameter autotuning"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "JIAWEI LI" }]
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "scikit-learn>=1.4",
  "torch>=2.4",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pandas>=2.1", "matplotlib>=3.8"]
onnx = ["onnx>=1.16", "onnxruntime>=1.18"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
