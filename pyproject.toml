[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jev-tune"
version = "1.0.0"
description = "Jev-inspired calibrated decision & safety shell for typed PID autotuning (temperature + conformal abstention) with C99/MATLAB ports. Not affiliated with TypeSafe AI."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "JIAWEI LI" }]
keywords = [
  "PID tuning",
  "autotuning",
  "control systems",
  "Simulink",
  "typed decisions",
  "selective prediction",
  "ONNX",
  "CPU inference",
  "conformal-prediction",
  "selective-prediction",
  "safety-critical",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Mathematics",
  "Topic :: System :: Hardware",
]
# jev_tune.core needs numpy only; the PID testbed adds scipy and runs the
# shipped head through onnxruntime. torch is needed only to train or fine-tune.
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "onnxruntime>=1.18",
]

[project.urls]
Homepage = "https://github.com/lijiawei255/jev-tune"
Repository = "https://github.com/lijiawei255/jev-tune"
Issues = "https://github.com/lijiawei255/jev-tune/issues"
Changelog = "https://github.com/lijiawei255/jev-tune/blob/main/CHANGELOG.md"

[project.optional-dependencies]
torch = ["torch>=2.4"]
baselines = ["scikit-learn>=1.4"]
plot = ["matplotlib>=3.8"]
export = ["onnx>=1.16"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "matplotlib>=3.8"]

[project.scripts]
jev-tune = "jev_tune.cli:main"
jev-tune-mcp = "jev_tune.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["jev_tune"]
# These three modules only do anything when MATLAB is installed; the GitHub
# runners have no licence, so counting them turns the coverage gate into a
# measure of "do we have MATLAB" rather than "is the code tested".
omit = [
  "*/jev_tune/domains/pid/matlab_runner.py",
  "*/jev_tune/domains/pid/matlab_worker.py",
  "*/jev_tune/domains/pid/matlab_baseline.py",
]

[tool.coverage.report]
skip_covered = true
