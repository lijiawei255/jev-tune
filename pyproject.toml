[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jev-tune"
version = "0.6.0"
description = "Jev-inspired typed-decision PID autotuning with measured budgets and explicit abstention; not affiliated with TypeSafe AI"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "JIAWEI LI" }]
keywords = [
  "PID tuning",
  "autotuning",
  "control systems",
  "Simulink",
  "typed decisions",
  "selective prediction",
  "ONNX",
  "CPU inference",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Mathematics",
  "Topic :: System :: Hardware",
]
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "scikit-learn>=1.4",
  "torch>=2.4",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "pandas>=2.1", "matplotlib>=3.8", "pillow>=10.0"]
onnx = ["onnx>=1.16", "onnxruntime>=1.18"]

[project.scripts]
jev-tune = "jev_tune.cli:main"
jev-tune-mcp = "jev_tune.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["jev_tune"]
# These three modules only do anything when MATLAB is installed; the GitHub
# runners have no licence, so counting them turns the coverage gate into a
# measure of "do we have MATLAB" rather than "is the code tested".
omit = [
  "*/jev_tune/matlab_runner.py",
  "*/jev_tune/matlab_worker.py",
  "*/jev_tune/matlab_baseline.py",
]

[tool.coverage.report]
skip_covered = true
