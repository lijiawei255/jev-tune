[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jev-tune"
version = "0.4.0"
description = "Jev-inspired typed-decision model for PID autotuning (choice / score / noul, 0.2 ms on CPU); not affiliated with TypeSafe AI"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "JIAWEI LI" }]
keywords = [
  "PID tuning",
  "autotuning",
  "control systems",
  "Simulink",
  "typed decisions",
  "selective prediction",
  "ONNX",
  "CPU inference",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Mathematics",
  "Topic :: System :: Hardware",
]
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "scikit-learn>=1.4",
  "torch>=2.4",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pandas>=2.1", "matplotlib>=3.8", "pillow>=10.0"]
onnx = ["onnx>=1.16", "onnxruntime>=1.18"]

[project.scripts]
jev-tune = "jev_tune.cli:main"
jev-tune-mcp = "jev_tune.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
